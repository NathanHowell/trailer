[project]
name = "trailer"
version = "0.1.0"
description = "LiDAR trail detection for OpenStreetMap, targeting a JOSM plugin"
readme = "README.md"
# The code only. Trained weights are CC BY-SA 4.0 and are not shipped in this
# distribution -- see LICENSE-MODEL. LICENSE-MODEL is deliberately not listed in
# license-files, so a scanner reading the wheel does not conclude the code is
# share-alike.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "laspy[lazrs]>=2.5.4",
    "matplotlib>=3.10.1",
    "numpy>=2.0",
    "pyproj>=3.7",
    "rasterio>=1.4",
    "requests>=2.32",
    "scikit-image>=0.25",
    "scikit-learn>=1.6",
    "scipy>=1.15",
    "shapely>=2.0",
]

[project.optional-dependencies]
# Training only. Inference in the JOSM plugin runs through onnxruntime's Java
# API, so nothing here ships to the plugin.
train = [
    "segmentation-models-pytorch>=0.4",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "onnx>=1.17",
    # torch.onnx.export defaults to the dynamo exporter from 2.13; it is the
    # maintained path, and it needs onnxscript to translate the graph.
    "onnxscript>=0.5",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
trailer = "trailer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
